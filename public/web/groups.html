<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Shell — المجموعات الدراسية" />
  <title>Code Shell — المجموعات الدراسية</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <style>
    .group-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .group-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }
    .groups-grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="assets/images/logo.png" alt="Code Shell Logo" class="sidebar-logo" />
        <span class="sidebar-brand">Code Shell</span>
      </div>
      <div class="sidebar-toggle" id="sidebar-toggle">
        <div class="sidebar-toggle-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
        <span>تصغير النافذة</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </span>
          <span class="nav-item-text">الرئيسية</span>
        </a>
        <a class="nav-item" href="courses.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </span>
          <span class="nav-item-text">الكورسات</span>
        </a>
        <a class="nav-item active" href="groups.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="nav-item-text">المجموعات</span>
        </a>
        <a class="nav-item" href="live.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="2"/>
              <path d="M16.24 7.76a6 6 0 0 1 0 8.49"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M7.76 16.24a6 6 0 0 1 0-8.49"/>
              <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
            </svg>
          </span>
          <span class="nav-item-text">اللايفات المباشرة</span>
        </a>
        <a class="nav-item" href="my-courses.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </span>
          <span class="nav-item-text">كورساتي الحالية</span>
        </a>
        <div class="sidebar-divider"></div>
        <a class="nav-item" href="profile.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="nav-item-text">حسابي</span>
        </a>
        <a id="teacher-nav-item" class="nav-item" href="teacher.html" style="display: none; background: rgba(59, 130, 246, 0.1); color: #3B82F6;">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </span>
          <span class="nav-item-text">👨‍🏫 نظام المدرس</span>
        </a>
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <header class="top-navbar">
        <div class="top-nav-right">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="فتح القائمة">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="top-nav-title">المجموعات الدراسية والتطبيقية</h2>
        </div>
        <div class="top-nav-left">
          <button class="top-nav-btn theme-single-btn" id="top-theme-btn" onclick="toggleTheme()" title="تغيير المظهر">
            <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
            <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="main-page-container">
        <div class="page-header animate-fadeIn">
          <div class="page-header-right">
            <h1 class="page-title">👥 المجموعات المتاحة للاشتراك</h1>
            <p class="page-greeting">اختر المجموعة المناسبة لك حسب المدرس والموعد المتاح للانضمام والبدء</p>
          </div>
        </div>

        <div id="groups-list-container" class="groups-grid-layout">
          <div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1;">
            جاري تحميل المجموعات الدراسية...
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/groups.js"></script>
</body>
</html>
