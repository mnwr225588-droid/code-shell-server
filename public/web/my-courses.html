<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <!-- إعدادات التجاوب مع شاشات الهواتف الذكية والأجهزة المحمولة -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Shell — كورساتي الحالية" />
  <meta name="theme-color" content="#2563EB" />
  <title>Code Shell — كورساتي الحالية</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  
  <!-- استدعاء ملفات التنسيقات (CSS): المتغيرات، التنسيقات الأساسية، العناصر المشتركة، وتنسيقات الصفحات -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- خلفية مظلمة شفافة تظهر عند فتح القائمة الجانبية في الهاتف -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- الهيكل العام للتطبيق: يشمل القائمة الجانبية (Sidebar) والمحتوى الرئيسي (Main Content) -->
  <div class="app-layout">
    
    <!-- القائمة الجانبية (Sidebar Navigation) -->
    <aside class="sidebar" id="sidebar">
      
      <!-- شعار المنصة واسم التطبيق في أعلى القائمة -->
      <div class="sidebar-header">
        <img src="assets/images/logo.png" alt="Code Shell Logo" class="sidebar-logo" />
        <span class="sidebar-brand">Code Shell</span>
      </div>

      <!-- زر تصغير / طي النافذة الجانبية -->
      <div class="sidebar-toggle" id="sidebar-toggle">
        <div class="sidebar-toggle-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
        <span>تصغير النافذة</span>
      </div>

      <!-- روابط التصفح الأساسية في القائمة الجانبية -->
      <nav class="sidebar-nav">
        
        <!-- رابط الصفحة الرئيسية -->
        <a class="nav-item" href="index.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
          </span>
          <span class="nav-item-text">الرئيسية</span>
        </a>

        <!-- رابط صفحة الكورسات -->
        <a class="nav-item" href="courses.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </span>
          <span class="nav-item-text">الكورسات</span>
        </a>

        <!-- رابط صفحة كورساتي الحالية (الصفحة النشطة) -->
        <a class="nav-item active" href="my-courses.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </span>
          <span class="nav-item-text">كورساتي الحالية</span>
        </a>

        <!-- خط فاصل -->
        <div class="sidebar-divider"></div>

        <!-- رابط صفحة المنتدى -->
        <a class="nav-item" href="community.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
            </svg>
          </span>
          <span class="nav-item-text">المنتدى</span>
        </a>

        <!-- رابط صفحة البث المباشر -->
        <a class="nav-item" href="live.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="2"/>
              <path d="M16.24 7.76a6 6 0 0 1 0 8.49"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M7.76 16.24a6 6 0 0 1 0-8.49"/>
              <path d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
            </svg>
          </span>
          <span class="nav-item-text">اللايفات المباشرة</span>
        </a>

        <!-- خط فاصل -->
        <div class="sidebar-divider"></div>

        <!-- رابط صفحة حسابي -->
        <a class="nav-item" href="profile.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span class="nav-item-text">حسابي</span>
        </a>

        <!-- رابط صفحة الإعدادات -->
        <a class="nav-item" href="settings.html">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span class="nav-item-text">الإعدادات</span>
        </a>

        <!-- زر تسجيل الخروج -->
        <a class="nav-item nav-item-logout" href="javascript:void(0)" onclick="logout()">
          <span class="nav-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </span>
          <span class="nav-item-text">تسجيل الخروج</span>
        </a>
      </nav>
    </aside>

    <!-- المحتوى الرئيسي لصفحة كورساتي الحالية -->
    <main class="main-content" id="main-content">
      
      <!-- الهيدر العلوي الثابت (Sticky Top Navbar) -->
      <header class="top-navbar">
        
        <!-- الجزء الأيمن: زر الهامبرغر للهاتف + عنوان الصفحة -->
        <div class="top-nav-right">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="فتح القائمة">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="top-nav-title">كورساتي الحالية</h2>
        </div>

        <!-- الجزء الأوسط: حقل البحث في الكورسات النشطة -->
        <div class="top-nav-center">
          <div class="top-nav-search">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="top-global-search" placeholder="إبحث في كورساتك" />
          </div>
        </div>

        <!-- الجزء الأيسر: أزرار التفاعل (الإشعارات + المظهر + الملف الشخصي) -->
        <div class="top-nav-left">
          <!-- زر الإشعارات -->
          <button class="top-nav-btn" id="top-notif-btn" title="الإشعارات">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="top-notif-badge"></span>
          </button>

          <!-- زر تغيير المظهر (فاتح/داكن) -->
          <button class="top-nav-btn theme-single-btn" id="top-theme-btn" onclick="toggleTheme()" title="تغيير المظهر">
            <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
            </svg>
            <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>

          <!-- رابط صورة الحساب الشخصي -->
          <a href="profile.html" class="top-nav-avatar" title="حسابي">
            <div class="avatar-circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </a>
        </div>
      </header>

      <!-- حاوية الكورسات النشطة التي يدرسها الطالب حالياً -->
      <div id="main-page-container">
        
        <div style="margin-bottom: 24px;">
          <h3 class="section-title">الكورسات التي تدرسها الآن 💡</h3>
          <p class="section-subtitle">تابع تقدمك واستكمل دروسك التعليمية من حيث توقفت</p>
        </div>

        <!-- كارت كورس أساسيات الحاسوب النشط حالياً (تصميم احترافي جديد) -->
        <div class="my-course-pro-card animate-fadeIn">
          
          <div class="pro-card-content">
            <!-- أيقونة الكورس مع تأثير الإضاءة -->
            <div class="pro-card-icon-wrapper">
              <div class="pro-card-icon">💻</div>
              <div class="pro-card-glow"></div>
            </div>

            <!-- معلومات الكورس ونسبة التقدم -->
            <div class="pro-card-info">
              <span class="pro-card-level">المستوى الأول — أساسي</span>
              <h4 class="pro-card-title">Computer Basics — أساسيات الحاسوب</h4>
              
              <!-- شريط مؤشر التقدم المئوي -->
              <div class="pro-card-progress-wrapper">
                <div class="pro-card-progress-track">
                  <div class="pro-card-progress-bar" id="my-course-progress-bar" style="width: 0%;">
                    <div class="pro-card-progress-glow"></div>
                  </div>
                </div>
                <span class="pro-card-progress-text" id="my-course-progress-text">0% مكتمل</span>
              </div>
            </div>
          </div>

          <!-- زر الاستمرار والتوجيه لدروس الكورس -->
          <div class="pro-card-actions">
            <a href="computer-basics.html" class="pro-card-btn">
              <span>متابعة الدروس</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(180deg);">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </a>
          </div>

        </div>

      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/my_courses.js"></script>
</body>
</html>
