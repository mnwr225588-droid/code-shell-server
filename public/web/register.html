<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Shell — إنشاء حساب جديد" />
  <title>Code Shell — إنشاء حساب جديد</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css?v=20260925v3" />
  <link rel="stylesheet" href="css/base.css?v=20260925v3" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 40%, #2563EB 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 32px 16px;
    }

    .bg-shape-1 {
      position: absolute;
      top: -120px;
      right: -100px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, rgba(37, 99, 235, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      animation: floatShape 8s infinite alternate ease-in-out;
    }

    .bg-shape-2 {
      position: absolute;
      bottom: -140px;
      left: -100px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.25) 0%, rgba(30, 58, 138, 0) 70%);
      pointer-events: none;
      filter: blur(60px);
      animation: floatShape 10s infinite alternate ease-in-out reverse;
    }

    @keyframes floatShape {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.08); }
    }

    /* كارت المصادقة المستقل لإنشاء الحساب */
    .auth-card-standalone {
      width: 100%;
      max-width: 640px;
      background: #FFFFFF;
      border-radius: 28px;
      padding: 42px 36px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.35), 0 0 40px rgba(37, 99, 235, 0.2);
      position: relative;
      z-index: 10;
      color: #0F172A;
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
      border: 2px solid #BFDBFE;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
    }

    .auth-title {
      font-size: 25px;
      font-weight: 900;
      color: #1E3A8A;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      font-size: 13.5px;
      color: #64748B;
      font-weight: 600;
    }

    /* تقسيم الحقول على شبكات 2 و 3 أعمدة */
    .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .form-grid-3, .form-grid-2 {
        grid-template-columns: 1fr;
      }
      .auth-card-standalone {
        padding: 30px 20px;
      }
    }

    .form-group-custom {
      margin-bottom: 16px;
      text-align: right;
    }

    .form-label-custom {
      display: block;
      font-size: 12.5px;
      font-weight: 800;
      color: #1E293B;
      margin-bottom: 6px;
    }

    .form-input-custom {
      width: 100%;
      height: 48px;
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13.5px;
      color: #0F172A;
      outline: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .form-input-custom:focus {
      border-color: #2563EB;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    select.form-input-custom option {
      background: #FFFFFF;
      color: #0F172A;
    }

    .auth-submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
    }

    .auth-card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748B;
      font-weight: 600;
    }

    .auth-card-footer a {
      color: #2563EB;
      text-decoration: none;
      font-weight: 800;
      margin-right: 4px;
    }

    .auth-card-footer a:hover {
      text-decoration: underline;
    }

    .alert-error {
      background: #FEF2F2;
      border: 1.5px solid #FCA5A5;
      color: #DC2626;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="bg-orb-1"></div>
  <div class="bg-orb-2"></div>

  <div class="auth-card-standalone">
    
    <div class="auth-brand">
      <div class="auth-logo-icon">
        <img src="assets/images/logo.png" alt="Code Shell Logo" style="width: 40px; height: 40px; object-fit: contain;" />
      </div>
      <h1 class="auth-title">إنشاء حساب طالب جديد</h1>
      <p class="auth-subtitle">أدخل بياناتك كاملة للتسجيل في منصة Code Shell</p>
    </div>

    <div id="register-error" class="alert-error"></div>

    <form id="register-form">
      <!-- 1. الأسماء الثلاثية -->
      <div class="form-grid-3">
        <div class="form-group-custom">
          <label for="reg-firstname" class="form-label-custom">الاسم الأول *</label>
          <input type="text" id="reg-firstname" name="first_name" class="form-input-custom" placeholder="محمد" required />
        </div>
        <div class="form-group-custom">
          <label for="reg-middlename" class="form-label-custom">اسم الأب *</label>
          <input type="text" id="reg-middlename" name="middle_name" class="form-input-custom" placeholder="أحمد" required />
        </div>
        <div class="form-group-custom">
          <label for="reg-lastname" class="form-label-custom">اللقب / العائلة *</label>
          <input type="text" id="reg-lastname" name="last_name" class="form-input-custom" placeholder="محمود" required />
        </div>
      </div>

      <!-- 2. تاريخ الميلاد والبريد -->
      <div class="form-grid-2">
        <div class="form-group-custom">
          <label for="reg-birthdate" class="form-label-custom">تاريخ الميلاد *</label>
          <input type="date" id="reg-birthdate" name="birth_date" class="form-input-custom" required />
        </div>
        <div class="form-group-custom">
          <label for="reg-email" class="form-label-custom">البريد الإلكتروني *</label>
          <input type="email" id="reg-email" name="email" class="form-input-custom" placeholder="student@example.com" required />
        </div>
      </div>

      <!-- 3. الدولة ورقم الهاتف -->
      <div class="form-grid-2">
        <div class="form-group-custom">
          <label for="reg-country" class="form-label-custom">الدولة *</label>
          <select id="reg-country" name="country" class="form-input-custom" required>
            <option value="EG" selected>🇪🇬 مصر (+20)</option>
            <option value="SA">🇸🇦 السعودية (+966)</option>
            <option value="AE">🇦🇪 الإمارات (+971)</option>
            <option value="KW">🇰🇼 الكويت (+965)</option>
            <option value="QA">🇶🇦 قطر (+974)</option>
            <option value="JO">🇯🇴 الأردن (+962)</option>
            <option value="IQ">🇮🇶 العراق (+964)</option>
            <option value="LY">🇱🇾 ليبيا (+218)</option>
            <option value="SD">🇸🇩 السودان (+249)</option>
            <option value="OTHER">🌍 دولة أخرى</option>
          </select>
        </div>
        <div class="form-group-custom">
          <label for="reg-phone" class="form-label-custom">رقم الهاتف *</label>
          <input type="tel" id="reg-phone" name="phone" class="form-input-custom" placeholder="01012345678" required />
        </div>
      </div>

      <!-- 4. كلمة المرور وتأكيدها -->
      <div class="form-grid-2">
        <div class="form-group-custom">
          <label for="reg-password" class="form-label-custom">كلمة المرور *</label>
          <input type="password" id="reg-password" name="password" class="form-input-custom" placeholder="******" required />
        </div>
        <div class="form-group-custom">
          <label for="reg-password-confirm" class="form-label-custom">تأكيد كلمة المرور *</label>
          <input type="password" id="reg-password-confirm" name="password_confirmation" class="form-input-custom" placeholder="******" required />
        </div>
      </div>

      <button type="submit" id="register-btn" class="auth-submit-btn">إنشاء الحساب 🚀</button>
    </form>

    <div class="auth-card-footer">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>

  </div>

  <script src="js/api.js?v=20260925v3"></script>
  <script src="js/pages/auth.js?v=20260925v3"></script>
</body>
</html>
