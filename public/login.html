<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Code Shell — تسجيل الدخول" />
  <title>Code Shell — تسجيل الدخول</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 50% 0%, #1E3A8A 0%, #0F172A 70%, #090D16 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* خلفيات الخواص الضوئية المضيئة Floating Glowing Orbs */
    .bg-orb-1 {
      position: absolute;
      top: -120px;
      right: -120px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.4) 0%, rgba(37, 99, 235, 0) 70%);
      pointer-events: none;
      filter: blur(40px);
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    .bg-orb-2 {
      position: absolute;
      bottom: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.35) 0%, rgba(124, 58, 237, 0) 70%);
      pointer-events: none;
      filter: blur(50px);
      animation: floatOrb 10s infinite alternate ease-in-out reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* كارت المصادقة الزجاجي الاحترافي (Glassmorphic Card) */
    .auth-card-standalone {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(37, 99, 235, 0.15);
      position: relative;
      z-index: 10;
      color: #FFFFFF;
      animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(124, 58, 237, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .auth-title {
      font-size: 26px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: #94A3B8;
      font-weight: 500;
    }

    /* حقول المدخلات */
    .form-group-custom {
      margin-bottom: 20px;
      text-align: right;
    }

    .form-label-custom {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #CBD5E1;
      margin-bottom: 8px;
    }

    .input-wrapper-custom {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-custom {
      position: absolute;
      right: 16px;
      color: #64748B;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-input-custom {
      width: 100%;
      height: 52px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 0 48px 0 16px;
      font-size: 14px;
      color: #FFFFFF;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input-custom:focus {
      border-color: #3B82F6;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    .form-input-custom:focus + .input-icon-custom {
      color: #3B82F6;
    }

    .password-toggle-btn {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .password-toggle-btn:hover {
      color: #FFFFFF;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94A3B8;
      cursor: pointer;
      user-select: none;
    }

    .forgot-link {
      color: #60A5FA;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #93C5FD;
      text-decoration: underline;
    }

    .auth-submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.25s ease;
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.5);
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
    }

    .auth-submit-btn:active {
      transform: translateY(0);
    }

    .auth-card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #94A3B8;
    }

    .auth-card-footer a {
      color: #60A5FA;
      text-decoration: none;
      font-weight: 700;
      margin-right: 4px;
    }

    .auth-card-footer a:hover {
      text-decoration: underline;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ADE80;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.6;
      display: none;
    }

    .forgot-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .forgot-modal-overlay.show {
      display: flex;
    }

    .forgot-modal-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .forgot-modal-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .forgot-modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .forgot-modal-desc {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.6;
    }

    .forgot-cancel-btn {
      width: 100%;
      height: 48px;
      background: transparent;
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .forgot-cancel-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- الدوائر المضيئة للخلفية -->
  <div class="bg-orb-1"></div>
  <div class="bg-orb-2"></div>

  <!-- كارت تسجيل الدخول المستقل -->
  <div class="auth-card-standalone">
    
    <div class="auth-brand">
      <div class="auth-logo-icon">
        <img src="assets/images/logo.png" alt="Code Shell Logo" style="width: 44px; height: 44px; object-fit: contain;" />
      </div>
      <h1 class="auth-title">Code Shell</h1>
      <p class="auth-subtitle">مرحباً بعودتك! ادخل إلى حسابك للاستمرار</p>
    </div>

    <div id="login-error" class="alert-error"></div>

    <form id="login-form">
      <!-- 1. البريد الإلكتروني -->
      <div class="form-group-custom">
        <label for="login-email" class="form-label-custom">البريد الإلكتروني</label>
        <div class="input-wrapper-custom">
          <svg class="input-icon-custom" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="login-email" name="email" class="form-input-custom" placeholder="student@example.com" required />
        </div>
      </div>

      <!-- 2. كلمة المرور -->
      <div class="form-group-custom">
        <label for="login-password" class="form-label-custom">كلمة المرور</label>
        <div class="input-wrapper-custom">
          <svg class="input-icon-custom" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="login-password" name="password" class="form-input-custom" placeholder="أدخل كلمة المرور" required />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password')">إظهار</button>
        </div>
      </div>

      <!-- 3. تذكرني ونسيت كلمة المرور -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember-me" checked style="accent-color: #2563EB; width: 16px; height: 16px;" />
          تذكرني
        </label>
        <a href="javascript:void(0)" onclick="openForgotPasswordModal()" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>

      <!-- 4. زر الدخول -->
      <button type="submit" id="login-btn" class="auth-submit-btn">تسجيل الدخول 👈</button>
    </form>

    <div class="auth-card-footer">
      ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a>
    </div>

  </div>

  <!-- نافذة نسيت كلمة المرور المنبثقة -->
  <div class="forgot-modal-overlay" id="forgot-password-modal" onclick="if(event.target===this)closeForgotPasswordModal()">
    <div class="forgot-modal-card">
      <div class="forgot-modal-header">
        <h3 class="forgot-modal-title">🔑 إعادة تعيين كلمة المرور</h3>
        <p class="forgot-modal-desc">أدخل بريدك الإلكتروني وستصلك رسالة تحتوي على رابط التعيين. (تأكد من فحص مجلد الرسائل غير المرغوب فيها Spam).</p>
      </div>

      <div id="forgot-error" class="alert-error"></div>
      <div id="forgot-success" class="alert-success"></div>

      <form id="forgot-password-form">
        <div class="form-group-custom">
          <label for="forgot-email-input" class="form-label-custom">البريد الإلكتروني</label>
          <div class="input-wrapper-custom">
            <svg class="input-icon-custom" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="forgot-email-input" class="form-input-custom" placeholder="student@example.com" required />
          </div>
        </div>

        <button type="submit" id="forgot-submit-btn" class="auth-submit-btn" style="margin-top: 10px;">إرسال رابط التعيين 📩</button>
        <button type="button" class="forgot-cancel-btn" onclick="closeForgotPasswordModal()">إلغاء ورجوع</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
